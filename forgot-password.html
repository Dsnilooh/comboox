<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comboox - Forgot Password</title>

    <link rel="icon" type="image/png" href="src/icons/main_logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #E3A852;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .forgot-container {
            width: 420px;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.20);
        }

        .forgot-container h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 20px;
            color: #333333;
        }

        .description {
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: #555555;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333333;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 10px;
            font-size: 17px;
            border: 1px solid #999999;
            border-radius: 5px;
        }

        .form-group input:focus {
            outline: none;
            border: 2px solid #C58A25;
        }

        .reset-button {
            width: 100%;
            height: 45px;
            background-color: #E3A852;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-button:hover {
            background-color: #D2953C;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
            font-size: 16px;
        }

        .back-login a {
            color: #333333;
            font-weight: bold;
            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="forgot-container">

        <h1>Forgot Password</h1>

        <p class="description">
            Enter your email address and we will send you a link
            to reset your password.
        </p>

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email">
        </div>

        <button class="reset-button">
            Send Reset Link
        </button>

        <div class="back-login">
            <a href="login.html">Back to Login</a>
        </div>

    </div>

</body>

</html>git status
