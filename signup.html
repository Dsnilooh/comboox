<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comboox</title>

    <link rel="icon" type="image/png" href="src/icons/main_logo.png">

    <style>
        body {
            background-color: #E3A852;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h3 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        label {
            font-size: 20px;
            font-weight: bold;
        }

        input {
            width: 300px;
            height: 40px;
            font-size: 18px;
            padding: 5px 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 180px;
            height: 45px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h3>Register new Comboox user</h3>

    <label>First Name:</label><br>
    <input type="text"><br>

    <label>Last Name:</label><br>
    <input type="text"><br>

    <label>Mobile Number:</label><br>
    <input type="number"><br>

    <label>Email:</label><br>
    <input type="email"><br>

    <label>Password:</label><br>
    <input type="password"><br>

    <button>Register</button>

</body>

</html>
