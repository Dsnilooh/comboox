<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comboox - Home</title>

    <link rel="icon" type="image/png" href="src/icons/main_logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #E3A852;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-container {
            width: 550px;
            background-color: white;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.20);
        }

        .home-container h1 {
            font-size: 42px;
            margin: 0 0 15px;
            color: #333333;
        }

        .welcome-text {
            font-size: 21px;
            color: #555555;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
            color: #333333;
            background-color: #E3A852;
            transition: 0.2s;
        }

        .button:hover {
            background-color: #D2953C;
        }

        .forgot-button {
            background-color: #F2F2F2;
        }

        .forgot-button:hover {
            background-color: #DDDDDD;
        }
    </style>
</head>

<body>

    <div class="home-container">

        <h1>WELCOME TO COMBOOX</h1>

        <p class="welcome-text">
            Welcome to our Comboox page
        </p>

        <div class="buttons">

            <a href="signup.html" class="button">
                Sign Up
            </a>

            <a href="login.html" class="button">
                Sign In
            </a>

            <a href="forgot-password.html" class="button forgot-button">
                Forgot Password
            </a>

        </div>

    </div>

</body>

</html>
