<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comboox - Welcome</title>

    <link rel="icon" type="image/png" href="src/icons/main_logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #E3A852;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-container {
            width: 690px;
            background-color: white;
            padding: 60px;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.20);
        }

        .welcome-container h1 {
            text-align: center;
            font-size: 54px;
            margin: 0 0 25px 0;
            color: #333333;
        }

        .welcome-container p {
            text-align: center;
            font-size: 27px;
            color: #3d4f66;
            margin-bottom: 45px;
        }

        .welcome-button {
            display: block;
            width: 100%;
            height: 66px;
            margin-bottom: 18px;

            background-color: #E3A852;
            border-radius: 7px;

            color: #222222;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            line-height: 66px;
        }

        .welcome-button:hover {
            background-color: #D2953C;
        }

        .forgot-button {
            background-color: #F1F1F1;
        }

        .forgot-button:hover {
            background-color: #E0E0E0;
        }
    </style>
</head>

<body>

    <div class="welcome-container">

        <h1>WELCOME TO<br>COMBOOX</h1>

        <p>Welcome to our Comboox page</p>

        <a href="signup.html" class="welcome-button">
            Sign Up
        </a>

        <a href="login.html" class="welcome-button">
            Sign In
        </a>

        <a href="forgot-password.html" class="welcome-button forgot-button">
            Forgot Password
        </a>

    </div>

</body>

</html>
