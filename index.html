<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comboox - Login</title>

    <link rel="icon" type="image/png" href="src/icons/main_logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #E3A852;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.20);
        }

        .login-container h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #333333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333333;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 10px;
            font-size: 17px;
            border: 1px solid #999999;
            border-radius: 5px;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
            color: #333333;
            text-decoration: none;
            font-size: 15px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-button {
            display: block;
            width: 100%;
            height: 45px;
            background-color: #E3A852;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #333333;
            text-align: center;
            text-decoration: none;
            line-height: 45px;
        }

        .login-button:hover {
            background-color: #D2953C;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            font-size: 16px;
        }

        .register-text a {
            color: #333333;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Login</h1>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <a href="forgot-password.html" class="forgot-password">
            I forgot my password
        </a>

        <a href="home.html" class="login-button">
            Login
        </a>

        <div class="register-text">
            Don't have an account?
            <a href="signup.html">Register</a>
        </div>

    </div>

</body>

</html>
